version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - db_data:/data
    environment:
      - DB_PATH=/data/finance.db
      - PORT=8080
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
