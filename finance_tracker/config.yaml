name: "Finance Tracker"
description: "Personal CFO — net worth, cash flow, plan, bank sync and an AI adviser"
version: "2.59.1"
slug: "finance_tracker"
init: false
image: "ghcr.io/mindaugasbalciunas/finance-tracker"

arch:
  - aarch64

ingress: true
ingress_port: 80
panel_icon: mdi:cash-multiple
panel_title: Finance

ports:
  80/tcp: 8099
  # Bare-API debug port: DISABLED by default — it bypasses nginx basic-auth,
  # leaving only the in-app lock between the LAN and the API. Re-enable
  # temporarily in the add-on's Network settings when debugging.
  8080/tcp: null
ports_description:
  80/tcp: "Finance Tracker web interface"
  8080/tcp: "Finance Tracker API (debug — no nginx auth; keep disabled)"

map:
  - data:rw

# Home Assistant backups: stop the app while its data is copied — the SQLite
# database (write-ahead log) can't be copied safely while it's being written.
# The app's own snapshots (backups/, up to ~40 full copies incl. secrets),
# the fictional demo database and the merchant-logo cache (fetched again on
# demand) stay out: the live database is in every backup.
backup: cold
backup_exclude:
  - "backups/*"
  - "demo/*"
  - "logo-cache/*"

options:
  anthropic_api_key: ""
  nexos_api_key: ""
  nexos_model: ""
  nexos_gateway_url: ""
  auth_user: "admin"
  auth_password: ""
  public_url: ""

schema:
  anthropic_api_key: str?
  nexos_api_key: str?
  nexos_model: str?
  nexos_gateway_url: str?
  auth_user: str?
  auth_password: str?
  public_url: str?
