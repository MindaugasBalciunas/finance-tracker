name: "Finance Tracker"
description: "Personal finance dashboard — transactions, balances, investments and AI insights"
version: "1.70.0"
slug: "finance_tracker"
init: false
image: "ghcr.io/mindaugasbalciunas/finance-tracker"

arch:
  - aarch64

ingress: true
ingress_port: 80
panel_icon: mdi:cash-multiple
panel_title: Finance

ports:
  80/tcp: 8099
  # Bare-API debug port: DISABLED by default — it bypasses nginx basic-auth,
  # leaving only the in-app lock between the LAN and the API. Re-enable
  # temporarily in the add-on's Network settings when debugging.
  8080/tcp: null
ports_description:
  80/tcp: "Finance Tracker web interface"
  8080/tcp: "Finance Tracker API (debug — no nginx auth; keep disabled)"

map:
  - data:rw

options:
  anthropic_api_key: ""
  nexos_api_key: ""
  nexos_model: ""
  nexos_gateway_url: ""
  auth_user: "admin"
  auth_password: ""

schema:
  anthropic_api_key: str?
  nexos_api_key: str?
  nexos_model: str?
  nexos_gateway_url: str?
  auth_user: str?
  auth_password: str?
