name: "Finance Tracker"
description: "Personal finance dashboard — transactions, balances, investments and AI insights"
version: "1.0.53"
slug: "finance_tracker"
init: false
image: "ghcr.io/mindaugasbalciunas/finance-tracker"

arch:
  - aarch64

ingress: true
ingress_port: 80
panel_icon: mdi:cash-multiple
panel_title: Finance

ports:
  80/tcp: 8099
  8080/tcp: 8098
ports_description:
  80/tcp: "Finance Tracker web interface"
  8080/tcp: "Finance Tracker API (debug)"

map:
  - data:rw

options:
  anthropic_api_key: ""
  auth_user: "admin"
  auth_password: ""

schema:
  anthropic_api_key: str?
  auth_user: str?
  auth_password: str?
