server {
    listen 80 default_server;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Don't advertise the nginx version in Server headers / error pages.
    server_tokens off;

    # Security headers for the internet-facing deployment (via DuckDNS/TLS
    # upstream). `always` so they ride 401s and proxied API responses too.
    # HSTS is honored only when the response is received over HTTPS, so plain
    # HTTP LAN access (homeassistant.local:8099) is unaffected. No
    # includeSubDomains/preload — DuckDNS is a shared parent domain.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # The SPA loads only its own bundled scripts/styles and talks only to
    # /api on this origin, so anything else is an injection. Inline styles
    # stay allowed (React/Recharts set style attributes); inline scripts do
    # not. blob:/data: images cover the receipt-scan preview.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;

    # Loaded at startup by run.sh — either sets auth_basic or is empty
    include /etc/nginx/auth.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Go backend running in the same container
    location /api/ {
        # Restores and receipt photos are larger than nginx's 1 MB default.
        client_max_body_size 60m;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI chat runs an agentic tool loop against a remote LLM gateway and
        # can legitimately take minutes. The backend bounds a whole chat to
        # 240s and streams whitespace heartbeats meanwhile; nginx must outwait
        # it AND forward those heartbeats unbuffered, so any proxy further out
        # keeps the connection alive instead of returning a bare 504.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html (never cached, so a
    # new release is picked up on the next load).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;
        try_files $uri $uri/ /index.html;
    }
}
