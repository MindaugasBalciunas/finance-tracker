server {
    listen 80 default_server;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Loaded at startup by run.sh — either sets auth_basic or is empty
    include /etc/nginx/auth.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Go backend running in the same container
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI chat/analysis calls a remote LLM gateway; a reasoning model can
        # take well over a minute, so allow a generous upstream read window
        # (the backend itself caps the gateway call at 120s).
        proxy_read_timeout 180s;
    }

    # Swagger UI is served by the Go backend at its root, not under /api.
    location /swagger/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
