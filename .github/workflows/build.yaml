name: Build & push add-on image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mindaugasbalciunas/finance-tracker

# One job: test, then build the arm64 binaries and the web app here — with
# Go's compile cache carried from the last run — and let Docker only copy
# them into the image. Before, a second job compiled everything again from
# scratch inside Docker (~85 s) and Go's cache was saved once and never
# updated, so the race-test build started cold every time (~85 s).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: finance_tracker/server/go.mod
          cache: false # the rolling cache below replaces setup-go's write-once one

      # Saved under a new key every run and restored from the latest, so only
      # packages that changed since the last run are compiled.
      - name: Go module and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('finance_tracker/server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('finance_tracker/server/go.sum') }}-
            go-${{ runner.os }}-

      - name: Server tests
        working-directory: finance_tracker/server
        run: |
          go vet ./...
          go test -race ./...

      - name: Web password / passkey gate (real nginx)
        run: |
          sudo apt-get install -y -qq nginx sqlite3 >/dev/null
          sudo systemctl stop nginx || true
          (cd finance_tracker/server && go build -o /tmp/ft ./cmd/server)
          finance_tracker/test/nginx_gate.sh /tmp/ft

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: finance_tracker/web/package-lock.json

      - name: Web tests and build
        working-directory: finance_tracker/web
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint . --max-warnings 0
          npx vitest run
          npm run build

      - name: Read version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' finance_tracker/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # What the image ships, built once: the add-on runs on arm64.
      - name: Build arm64 binaries and stage the web app
        working-directory: finance_tracker
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p prebuilt
          (cd server && go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" -o ../prebuilt/finance-tracker ./cmd/server)
          (cd server && go build -trimpath -ldflags "-s -w" -o ../prebuilt/finance-tracker-mcp ./cmd/mcp)
          cp -R web/dist prebuilt/web
          file prebuilt/finance-tracker | grep -q 'ARM aarch64'

      - name: Set up QEMU (for the arm64 image's RUN steps)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aarch64 image
        uses: docker/build-push-action@v7
        with:
          context: ./finance_tracker
          file: ./finance_tracker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
